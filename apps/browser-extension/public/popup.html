<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <title>LookSave kiyintirish</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111827;
        --dim: #6b7280;
        --line: #e5e7eb;
        --brand: #111827;
        --brand-fg: #ffffff;
        --danger: #dc2626;
        --ok: #16a34a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f19;
          --fg: #f3f4f6;
          --dim: #9ca3af;
          --line: #1f2937;
          --brand: #f3f4f6;
          --brand-fg: #0b0f19;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 360px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 14px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 12px;
        color: var(--dim);
      }

      input,
      select {
        width: 100%;
        margin-top: 4px;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
      }

      button {
        width: 100%;
        padding: 8px 10px;
        border: 0;
        border-radius: 7px;
        background: var(--brand);
        color: var(--brand-fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button.ghost {
        background: transparent;
        color: var(--dim);
        border: 1px solid var(--line);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .hidden {
        display: none;
      }

      .stat {
        display: flex;
        justify-content: space-between;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        margin-bottom: 10px;
        font-variant-numeric: tabular-nums;
      }

      .log {
        max-height: 190px;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 8px;
        margin-top: 10px;
        font-size: 11px;
        color: var(--dim);
        white-space: pre-wrap;
      }

      .err {
        color: var(--danger);
        font-size: 12px;
        margin-top: 8px;
      }
      .note {
        color: var(--dim);
        font-size: 11px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>LookSave — AI kiyintirish</h1>

    <section id="auth" class="hidden">
      <label>Telefon<input id="phone" type="tel" placeholder="+998901234567" /></label>
      <label>Parol<input id="password" type="password" /></label>
      <button id="login">Kirish</button>
      <p class="note">Kengaytma panelnikidan ALOHIDA kiradi — panel sessiyasi buzilmaydi.</p>
    </section>

    <section id="main" class="hidden">
      <div class="stat">
        <span id="state">Bo`sh</span>
        <span id="count">0/0</span>
      </div>

      <label>Ish (avatar navbati)<select id="task"></select></label>
      <label
        >AI sayti<select id="adapter">
          <option value="chatgpt">ChatGPT</option>
          <option value="gemini">Gemini</option>
        </select></label
      >

      <label class="auto">
        <input id="auto" type="checkbox" />
        <span>Avtomatik — navbatni o`zi oladi va ketma-ket bajaradi</span>
      </label>

      <div class="row">
        <button id="start">Shu ishni boshlash</button>
        <button id="stop" class="ghost">To`xtatish</button>
      </div>

      <div class="row">
        <button id="diagnose" class="ghost">Sahifani tekshirish</button>
        <button id="testsend" class="ghost">Yuborishni sinash</button>
      </div>

      <div id="log" class="log"></div>
      <div class="row"><button id="logout" class="ghost">Chiqish</button></div>
    </section>

    <p id="error" class="err"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
